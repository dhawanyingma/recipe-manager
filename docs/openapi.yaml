openapi: 3.0.3
info:
  title: Flask Recipe Manager API
  version: "1.0.0"
  description: |
    A simple Recipe Manager API built with Flask and SQLAlchemy.
    Supports CRUD operations, pagination, search, and error handling.

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /version:
    get:
      summary: API version
      responses:
        '200':
          description: Returns the API version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: v1

  /recipes:
    get:
      summary: List recipes with pagination and optional search
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 10
            maximum: 100
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of recipes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'
                  page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
    post:
      summary: Create a new recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
      responses:
        '201':
          description: Recipe created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /recipes/{id}:
    get:
      summary: Get a recipe by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A recipe object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '404':
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a recipe by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdate'
      responses:
        '200':
          description: Recipe updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '404':
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a recipe by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Recipe deleted
        '404':
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Recipe:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Chicken Curry"
        ingredients:
          type: string
          example: "chicken, onion, garlic, spices"
        instructions:
          type: string
          example: "Heat oil, add spices, cook chicken for 30 mins."
        tags:
          type: string
          example: "dinner,spicy"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecipeCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          example: "Pasta Salad"
        ingredients:
          type: string
          example: "pasta, tomato, olive oil"
        instructions:
          type: string
          example: "Boil pasta, mix with vegetables, serve."
        tags:
          type: string
          example: "quick,lunch"

    RecipeUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        ingredients:
          type: string
        instructions:
          type: string
        tags:
          type: string

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: "Recipe not found"
